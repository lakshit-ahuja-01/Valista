<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Granny Escape (Stun Traps)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display.swap');
        
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #1a1a1a;
            color: #eaeaea;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        canvas {
            background-color: #000;
            display: block;
            border: 4px solid #555;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            /* Dimensions will be set by script */
        }

        .game-btn, .menu-btn {
            font-family: 'Press Start 2P', cursive;
            background-color: #dc2626;
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            border: 2px solid #f87171;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }
        .game-btn:hover, .menu-btn:hover {
            background-color: #f87171;
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.6);
        }
        .game-btn:active, .menu-btn:active {
            transform: translateY(1px);
        }

        /* Difficulty button styling */
        .diff-btn {
            font-family: 'Press Start 2P', cursive;
            padding: 0.75rem 1.5rem;
            border: 2px solid #555;
            background-color: #374151;
            color: #d1d5db;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .diff-btn:hover {
            background-color: #4b5563;
            border-color: #9ca3af;
        }
        .diff-btn.selected {
            background-color: #f87171;
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 15px rgba(248, 113, 113, 0.5);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div id="main-menu" class="flex flex-col items-center justify-center text-center w-full">
        <h1 class="text-6xl text-red-500 mb-6">ESCAPE</h1>
        <h2 class="text-2xl text-gray-300 mb-12">THE HOUSE</h2>

        <h3 class="text-xl text-white mb-4">Select Difficulty:</h3>
        <div class="flex gap-4 mb-12">
            <button id="easy-btn" class="diff-btn selected">Easy</button>
            <button id="hard-btn" class="diff-btn">Hard</button>
            <button id="extreme-btn" class="diff-btn">Extreme</button>
        </div>

        <button id="play-btn" class="menu-btn">Play</button>
    </div>

    <div id="game-container" class="hidden flex flex-col items-center">
        <h1 class="text-4xl text-red-500 mb-4 text-center">ESCAPE THE HOUSE (RANDOM)</h1>
        <p class="text-lg text-gray-300 mb-2">The map is new every time!</p>
        <p class="text-lg text-gray-300 mb-4">Avoid <span class="text-red-400">Granny</span>!</p>

        <div id="game-ui" class="mb-4 text-xl flex flex-col sm:flex-row items-center justify-between w-full max-w-lg">
            <div class="text-lg">
                <span>Inventory:</span>
                <div id="inv-slot-key1" class="w-8 h-8 bg-gray-700 border-2 border-gray-500 inline-block align-middle p-1">
                    <div id="inv-key1" class="w-full h-full bg-yellow-400 hidden"></div>
                </div>
                <div id="inv-slot-key2" class="w-8 h-8 bg-gray-700 border-2 border-gray-500 inline-block align-middle p-1">
                    <div id="inv-key2" class="w-full h-full bg-blue-400 hidden"></div>
                </div>
            </div>
            <span id="game-message" class="text-red-500 mt-2 sm:mt-0 text-base"></span>
        </div>

        <canvas id="gameCanvas"></canvas>

        <!-- THIS HTML IS UPDATED WITH SWAPPED KEY OBJECTIVES -->
        <div id="objectives-container" class="mt-4 text-left w-full max-w-lg">
            <h3 class="text-xl mb-2">Objectives:</h3>
            <ul class="text-sm list-disc list-inside">
                <!-- MODIFIED: key1 (Yellow) is now the Door Key -->
                <li id="obj-key1" class="text-gray-400">Find the <span class="text-yellow-400 font-bold">Door Key</span></li>
                <li id="obj-door" class="text-gray-400">Unlock the <span class="text-blue-400 font-bold">Blue Door</span></li>
                <!-- MODIFIED: key2 (Blue) is now the Exit Key -->
                <li id="obj-key2" class="text-gray-400">Find the <span class="text-blue-400 font-bold">Exit Key</span></li>
                <li id="obj-exit" class="text-gray-400">Escape the house!</li>
            </ul>
        </div>
    </div>

    <div id="message-screen" class="hidden absolute inset-0 bg-black bg-opacity-80 flex flex-col items-center justify-center text-center p-4">
        <h2 id="message-title" class="text-6xl mb-8"></h2>
        <button id="restart-btn" class="game-btn">Main Menu</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const gameMessageEl = document.getElementById('game-message');
            const messageScreen = document.getElementById('message-screen');
            const messageTitle = document.getElementById('message-title');
            const restartBtn = document.getElementById('restart-btn');

            // NEW: Menu and Game Container Elements
            const mainMenu = document.getElementById('main-menu');
            const gameContainer = document.getElementById('game-container');
            const playBtn = document.getElementById('play-btn');
            const easyBtn = document.getElementById('easy-btn');
            const hardBtn = document.getElementById('hard-btn');
            const extremeBtn = document.getElementById('extreme-btn');

            // Inventory & Objective Elements
            const invKey1El = document.getElementById('inv-key1');
            const invKey2El = document.getElementById('inv-key2');
            const objKey1El = document.getElementById('obj-key1');
            const objKey2El = document.getElementById('obj-key2');
            const objDoorEl = document.getElementById('obj-door');
            const objExitEl = document.getElementById('obj-exit');

            // --- Game Entities ---
            let player, granny, exit;
            let noiseTraps = [], hidingSpots = [], patrolPoints = [], stunTraps = []; // <-- MODIFIED
            let key1, key2, door; 
            
            // --- Game Configuration ---
            const TILE_SIZE = 24; // Pixel size for 2D
            const MAP_COLS = 21; // Must be odd
            const MAP_ROWS = 17; // Must be odd
            const PLAYER_VIEW_DISTANCE = 8; 
            
            // Set canvas size
            canvas.width = TILE_SIZE * MAP_COLS;
            canvas.height = TILE_SIZE * MAP_ROWS;

            let gameMap = []; 
            let keys = { key1: false, key2: false };
            let gameState = 'playing';
            
            // --- AI State ---
            let grannyState = 'PATROLLING';
            let grannyPath = [];
            let grannyPatrolPointsCoords = [];
            let grannyTarget = null;
            let grannyIdleTimer = 0;
            let grannyMoveCounter = 0;
            const CHASE_DISTANCE = 6; 
            let playerIsHiding = false;

            // --- Difficulty Settings ---
            let gameDifficulty = 'EASY';
            let numNoiseTraps, numStunTraps; // <-- MODIFIED
            let currentGrannySpeed;
            let playerMoveCooldown;
            let playerCanMove = true;
            let moveTimeoutID = null; // <-- NEW: To manage stun/cooldowns

            // --- THIS IS MODIFIED ---
            const COLORS = {
                PLAYER: '#f97316', // Orange
                GRANNY: '#ef4444', // Red
                WALL: '#4b5563',   // Gray
                FLOOR: '#1f2937',   // Darker Gray
                KEY1: '#facc15',   // Yellow
                KEY2: '#3b82f6',   // Blue
                EXIT: '#22c55e',   // Green
                DOOR: '#3b82f6',   // Blue
                DOOR_LOCKED: '#3b82f6',
                TRAP: '#991b1b',   // Dark Red
                TRAP_INACTIVE: '#450a0a',
                STUN_TRAP: '#06b6d4', // <-- NEW: Cyan
                STUN_TRAP_INACTIVE: '#0e7490', // <-- NEW: Dark Cyan
                HIDING: '#581c87', // Dark Purple
                PATROL: '#6b7280'  // Medium Gray
            };

            // --- THIS IS MODIFIED ---
            function initGame() {
                // Reset game state
                gameMap = [];
                noiseTraps = []; stunTraps = []; hidingSpots = []; patrolPoints = []; // <-- MODIFIED
                grannyPatrolPointsCoords = [];
                keys = { key1: false, key2: false };
                gameState = 'playing';
                grannyMoveCounter = 0;
                gameMessageEl.textContent = '';
                messageScreen.classList.add('hidden');
                playerIsHiding = false;

                // Clear any pending player movement timeouts
                if (moveTimeoutID) clearTimeout(moveTimeoutID);
                playerCanMove = true; 

                // --- Set settings based on difficulty ---
                switch (gameDifficulty) {
                    case 'HARD':
                        numNoiseTraps = 5;
                        numStunTraps = 5;
                        currentGrannySpeed = { 'PATROLLING': 20, 'CHASING': 10, 'IDLE': 12 };
                        playerMoveCooldown = 100;
                        break;
                    case 'EXTREME':
                        numNoiseTraps = 8;
                        numStunTraps = 7;
                        currentGrannySpeed = { 'PATROLLING': 15, 'CHASING': 8, 'IDLE': 10 };
                        playerMoveCooldown = 200;
                        break;
                    case 'EASY':
                    default:
                        numNoiseTraps = 3;
                        numStunTraps = 2;
                        currentGrannySpeed = { 'PATROLLING': 25, 'CHASING': 12, 'IDLE': 15 };
                        playerMoveCooldown = 0;
                        break;
                }

                // --- Generate Map ---
                gameMap = generateMap(MAP_COLS, MAP_ROWS);
                placeGameObjects(); // This is now a more complex function
                
                // Set initial AI state
                grannyState = 'PATROLLING';
                grannyTarget = getRandomPatrolPoint();
                
                // Reset UI
                updateUI();
                
                // Reset Objectives UI
                [objKey1El, objKey2El, objDoorEl, objExitEl].forEach(el => {
                    el.classList.remove('line-through', 'text-green-500');
                    el.classList.add('text-gray-400');
                });
                
                if (!gameLoop._running) {
                    gameLoop._running = true;
                    gameLoop();
                }
            }
            
            // --- Map Generation (Randomized DFS) ---
            function generateMap(cols, rows) {
                let map = Array.from({ length: rows }, () => Array(cols).fill('1')); // Fill with walls
                let stack = [];
                let startX = 1, startY = 1; // Start at (1,1)

                map[startY][startX] = '0'; // Carve start
                stack.push({ x: startX, y: startY });

                function getNeighbors(x, y) {
                    let neighbors = [];
                    // Check 2 steps away
                    if (y > 1 && map[y - 2][x] === '1') neighbors.push({ x: x, y: y - 2, dx: 0, dy: -1 });
                    if (y < rows - 2 && map[y + 2][x] === '1') neighbors.push({ x: x, y: y + 2, dx: 0, dy: 1 });
                    if (x > 1 && map[y][x - 2] === '1') neighbors.push({ x: x - 2, y: y, dx: -1, dy: 0 });
                    if (x < cols - 2 && map[y][x + 2] === '1') neighbors.push({ x: x + 2, y: y, dx: 1, dy: 0 });
                    return neighbors;
                }

                while (stack.length > 0) {
                    let current = stack[stack.length - 1]; // Peek at stack top
                    let neighbors = getNeighbors(current.x, current.y);
                    
                    if (neighbors.length > 0) {
                        let neighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                        
                        // Carve path
                        map[current.y + neighbor.dy][current.x + neighbor.dx] = '0';
                        map[neighbor.y][neighbor.x] = '0';
                        
                        stack.push(neighbor);
                    } else {
                        stack.pop(); // Backtrack
                    }
                }
                return map;
            }

            // --- HELPER: Check if a tile is a floor
            function isFloor(x, y, map) {
                if (x < 0 || x >= MAP_COLS || y < 0 || y >= MAP_ROWS) return false;
                return map[y][x] === '0';
            }

            // --- HELPER: Find all reachable tiles (for map splitting) ---
            function bfsFindReachable(startPos, map) {
                let queue = [startPos];
                let visited = new Set();
                let reachable = [];
                const startKey = `${startPos.x},${startPos.y}`;
                visited.add(startKey);
                reachable.push(startPos);

                const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];

                while (queue.length > 0) {
                    let current = queue.shift();

                    for (const [dx, dy] of dirs) {
                        const nextX = current.x + dx;
                        const nextY = current.y + dy;
                        const nextKey = `${nextX},${nextY}`;
                        
                        // Check map bounds
                        if (nextX < 0 || nextX >= MAP_COLS || nextY < 0 || nextY >= MAP_ROWS) continue;

                        const tile = map[nextY][nextX];
                        
                        // Can only move on floors ('0')
                        if (tile === '0' && !visited.has(nextKey)) {
                            visited.add(nextKey);
                            const nextPos = { x: nextX, y: nextY };
                            queue.push(nextPos);
                            reachable.push(nextPos);
                        }
                    }
                }
                return reachable;
            }

            // --- HELPER: Get floor neighbors of a tile ---
            function getFloorNeighbors(x, y, map) {
                let neighbors = [];
                const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
                for (const [dx, dy] of dirs) {
                    if (isFloor(x + dx, y + dy, map)) {
                        neighbors.push({ x: x + dx, y: y + dy });
                    }
                }
                return neighbors;
            }


            // --- THIS IS MODIFIED ---
            // --- THIS FUNCTION CONTAINS THE SWAPPED KEY PLACEMENT ---
            function placeGameObjects() {
                let floorCells = [];
                let wallCells = [];
                
                for (let r = 0; r < MAP_ROWS; r++) {
                    for (let c = 0; c < MAP_COLS; c++) {
                        if (gameMap[r][c] === '0') {
                            floorCells.push({ x: c, y: r });
                        } else if (gameMap[r][c] === '1') {
                            // Find valid door spots (wall between two floors)
                            if (r > 0 && r < MAP_ROWS - 1 && gameMap[r-1][c] === '0' && gameMap[r+1][c] === '0') {
                                wallCells.push({ x: c, y: r });
                            }
                            if (c > 0 && c < MAP_COLS - 1 && gameMap[r][c-1] === '0' && gameMap[r][c+1] === '0') {
                                wallCells.push({ x: c, y: r });
                            }
                        }
                    }
                }
                
                // --- NEW LOGIC: Split Map with Door ---

                // 1. Pick a door and place it
                wallCells.sort(() => Math.random() - 0.5);
                let dPos = wallCells.pop();
                if (!dPos) { // Failsafe if no valid walls
                   dPos = {x: 1, y: 2}; // Just pick a spot
                }
                gameMap[dPos.y][dPos.x] = 'D';
                door = { x: dPos.x, y: dPos.y, isLocked: true };

                // 2. Find the two floor tiles this door separates
                let doorNeighbors = getFloorNeighbors(dPos.x, dPos.y, gameMap);

                // 3. Flood-fill from each side to get the two zones
                let roomTiles = bfsFindReachable(doorNeighbors[0], gameMap);
                let mainMazeTiles = bfsFindReachable(doorNeighbors[1], gameMap);

                // 4. Place objects in their correct zones
                
                // Shuffle for random placement
                roomTiles.sort(() => Math.random() - 0.5);
                mainMazeTiles.sort(() => Math.random() - 0.5);

                // --- THIS IS THE SWAPPED LOGIC ---
                // Blue Key (key2, "Exit Key") goes in the "room"
                let k2Pos = roomTiles.pop() || doorNeighbors[0]; // Failsafe
                gameMap[k2Pos.y][k2Pos.x] = 'K'; // 'K' is key2
                key2 = { x: k2Pos.x, y: k2Pos.y, visible: true };

                // Everything else goes in the "main maze"
                let pPos = mainMazeTiles.pop() || doorNeighbors[1];
                player = { x: pPos.x, y: pPos.y };
                
                let gPos = mainMazeTiles.pop() || doorNeighbors[1];
                granny = { x: gPos.x, y: gPos.y };

                // Yellow Key (key1, "Door Key") goes in the "main maze"
                let k1Pos = mainMazeTiles.pop() || doorNeighbors[1];
                gameMap[k1Pos.y][k1Pos.x] = '2'; // '2' is key1
                key1 = { x: k1Pos.x, y: k1Pos.y, visible: true };

                let ePos = mainMazeTiles.pop() || doorNeighbors[1];
                gameMap[ePos.y][ePos.x] = '3';
                exit = { x: ePos.x, y: ePos.y };
                // --- END OF SWAPPED LOGIC ---
                
                // 5. Place remaining items (traps, hiding, patrol) in the MAIN MAZE
                const numHiding = 5;
                const numPatrol = 4;
                const MIN_HIDING_DIST = 5; 

                // Noise Traps
                for (let i = 0; i < numNoiseTraps && mainMazeTiles.length > 0; i++) {
                    let tPos = mainMazeTiles.pop();
                    if (!tPos) break;
                    gameMap[tPos.y][tPos.x] = 'T';
                    noiseTraps.push({ x: tPos.x, y: tPos.y, active: true });
                }

                // Stun Traps
                for (let i = 0; i < numStunTraps && mainMazeTiles.length > 0; i++) {
                    let sPos = mainMazeTiles.pop();
                    if (!sPos) break;
                    gameMap[sPos.y][sPos.x] = 'S';
                    stunTraps.push({ x: sPos.x, y: sPos.y, active: true });
                }
                
                // Hiding Spots (with spacing)
                let placedHidingSpots = 0;
                let iterations = 0; // Safety brake
                while (placedHidingSpots < numHiding && mainMazeTiles.length > 0 && iterations < 1000) {
                    let potentialPos = mainMazeTiles.pop();
                    if (!potentialPos) break; 
                    
                    let isValid = true;
                    for (const spot of hidingSpots) {
                        const dist = Math.abs(potentialPos.x - spot.x) + Math.abs(potentialPos.y - spot.y);
                        if (dist < MIN_HIDING_DIST) {
                            isValid = false;
                            break; 
                        }
                    }

                    if (isValid) {
                        gameMap[potentialPos.y][potentialPos.x] = 'H';
                        hidingSpots.push({ x: potentialPos.x, y: potentialPos.y });
                        placedHidingSpots++;
                    }
                    iterations++;
                }

                // Patrol Points
                for (let i = 0; i < numPatrol && mainMazeTiles.length > 0; i++) {
                    let wPos = mainMazeTiles.pop();
                    if (!wPos) break;
                    gameMap[wPos.y][wPos.x] = 'W';
                    grannyPatrolPointsCoords.push({ x: wPos.x, y: wPos.y });
                }
            }


            // --- Game Loop ---
            function gameLoop() {
                if (gameState !== 'playing') {
                    gameLoop._running = false;
                    return;
                }
                
                update();
                draw();
                
                requestAnimationFrame(gameLoop);
            }
            gameLoop._running = false;

            // --- Update Game State ---
            function update() {
                updateGranny();
                checkCollisions();
            }

            // --- THIS IS MODIFIED ---
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                for (let r = 0; r < MAP_ROWS; r++) {
                    for (let c = 0; c < MAP_COLS; c++) {
                        const tile = gameMap[r][c];
                        const x = c * TILE_SIZE;
                        const y = r * TILE_SIZE;
                        
                        // Default floor
                        ctx.fillStyle = COLORS.FLOOR;
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

                        switch(tile) {
                            case '1': ctx.fillStyle = COLORS.WALL; break;
                            case 'D': ctx.fillStyle = door.isLocked ? COLORS.DOOR_LOCKED : COLORS.FLOOR; break;
                            case 'T': 
                                const trap = noiseTraps.find(t => t.x === c && t.y === r);
                                ctx.fillStyle = (trap && trap.active) ? COLORS.TRAP : COLORS.TRAP_INACTIVE;
                                break;
                            case 'S': // <-- NEW
                                const stunTrap = stunTraps.find(t => t.x === c && t.y === r);
                                ctx.fillStyle = (stunTrap && stunTrap.active) ? COLORS.STUN_TRAP : COLORS.STUN_TRAP_INACTIVE;
                                break;
                            case 'H': ctx.fillStyle = COLORS.HIDING; break;
                            case 'W': ctx.fillStyle = COLORS.PATROL; break;
                            case '3': ctx.fillStyle = COLORS.EXIT; break;
                            default: ctx.fillStyle = COLORS.FLOOR;
                        }
                        
                        if (tile !== '0' && tile !== 'K' && tile !== '2') { // Don't draw over keys
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
                
                // Draw Keys
                if (key1.visible) {
                    drawItem(key1.x, key1.y, COLORS.KEY1);
                }
                if (key2.visible) {
                    drawItem(key2.x, key2.y, COLORS.KEY2);
                }
                
                // Draw Granny (only if visible)
                const distToGranny = Math.abs(player.x - granny.x) + Math.abs(player.y - granny.y);
                if (distToGranny <= PLAYER_VIEW_DISTANCE) {
                    drawItem(granny.x, granny.y, COLORS.GRANNY);
                }
                
                // Draw Player
                // Only draw player if not hiding
                if (!playerIsHiding) {
                    drawItem(player.x, player.y, COLORS.PLAYER);
                }
            }
            
            function drawItem(gridX, gridY, color) {
                const x = gridX * TILE_SIZE;
                const y = gridY * TILE_SIZE;
                ctx.fillStyle = color;
                ctx.fillRect(x + TILE_SIZE * 0.1, y + TILE_SIZE * 0.1, TILE_SIZE * 0.8, TILE_SIZE * 0.8);
            }

            // --- THIS IS MODIFIED ---
            function movePlayer(dx, dy) {
                // Check if playing and if cooldown is over
                if (gameState !== 'playing' || !playerCanMove) return;

                const newX = player.x + dx;
                const newY = player.y + dy;

                if (isWalkable(newX, newY)) {
                    player.x = newX;
                    player.y = newY;
                    
                    // Apply cooldown
                    if (playerMoveCooldown > 0) {
                        playerCanMove = false;
                        // Clear any existing timeout just in case
                        if (moveTimeoutID) clearTimeout(moveTimeoutID);
                        moveTimeoutID = setTimeout(() => { playerCanMove = true; }, playerMoveCooldown);
                    }

                    checkInteractions();
                }
            }

            // --- isWalkable function ---
            function isWalkable(x, y) {
                if (x < 0 || x >= MAP_COLS || y < 0 || y >= MAP_ROWS) return false;
                const tile = gameMap[y][x];
                if (tile === '1') return false;
                // Check the door object, not just the map tile
                if (tile === 'D' && door.isLocked) return false;
                return true;
            }
            
            // --- THIS IS MODIFIED ---
            // --- THIS FUNCTION CONTAINS THE SWAPPED KEY LOGIC ---
            function checkInteractions() {
                const playerTile = gameMap[player.y][player.x];
                
                // Check Hiding
                playerIsHiding = (playerTile === 'H');
                
                // Pick up Key 1 (Yellow, now Door Key)
                if (player.x === key1.x && player.y === key1.y && key1.visible) {
                    keys.key1 = true;
                    key1.visible = false;
                    showGameMessage('Got the Door Key!', 'yellow'); // Updated message
                }
                
                // Pick up Key 2 (Blue, now Exit Key)
                if (player.x === key2.x && player.y === key2.y && key2.visible) {
                    keys.key2 = true;
                    key2.visible = false;
                    showGameMessage('Got the Exit Key!', 'blue'); // Updated message
                }
                
                // --- THIS IS THE SWAPPED LOGIC ---
                // Check Door
                if (playerTile === 'D') {
                    if (keys.key1 && door.isLocked) { // <-- SWAPPED: Checks for key1
                        door.isLocked = false;
                        showGameMessage('Door Unlocked!', 'yellow'); // Color updated
                        // Update objective
                        objDoorEl.classList.add('line-through', 'text-green-500');
                        objDoorEl.classList.remove('text-gray-400');
                    } else if (door.isLocked) {
                        showGameMessage('Door is locked. Find the yellow key!', 'yellow'); // SWAPPED: Message
                    }
                }
                
                // Check Exit
                if (playerTile === '3') {
                    if (keys.key2) { // <-- SWAPPED: Checks for key2
                        winGame();
                    } else {
                        showGameMessage('You need the blue key to exit!', 'blue'); // SWAPPED: Message
                    }
                }
                // --- END OF SWAPPED LOGIC ---
                
                // Check Noise Trap
                if (playerTile === 'T') {
                    const trap = noiseTraps.find(t => t.x === player.x && t.y === player.y);
                    if (trap && trap.active) {
                        triggerNoiseTrap(trap);
                    }
                }

                // Check Stun Trap
                if (playerTile === 'S') {
                    const trap = stunTraps.find(t => t.x === player.x && t.y === player.y);
                    if (trap && trap.active) {
                        triggerStunTrap(trap); // <-- NEW
                    }
                }
                
                updateUI();
            }
            
            function triggerNoiseTrap(trap) {
                trap.active = false;
                showGameMessage('You made a noise!', 'red');
                
                // Alert Granny
                grannyState = 'IDLE'; // Use IDLE state to investigate
                grannyTarget = { x: player.x, y: player.y }; // Set target to trap location
                grannyIdleTimer = 180; // Set timer
                grannyPath = []; // Force path recalculation
            }
            
            // --- NEW FUNCTION ---
            function triggerStunTrap(trap) {
                trap.active = false;
                showGameMessage('You are stuck!', 'cyan'); // Use a different color

                // Stop the player
                playerCanMove = false;
                
                // Clear any existing move cooldowns
                if (moveTimeoutID) clearTimeout(moveTimeoutID);

                // Set a 2-second stun
                moveTimeoutID = setTimeout(() => {
                    playerCanMove = true;
                    showGameMessage('You can move again!', 'cyan');
                }, 2000);
            }
            
            // --- Granny AI ---
            function updateGranny() {
                
                // --- AI State Logic (Handles state transitions) ---
                // (This runs every frame)
                const distToPlayer = Math.abs(player.x - granny.x) + Math.abs(player.y - granny.y);
                
                // 1. Check if player is visible and start chasing
                if (grannyState !== 'CHASING' && grannyState !== 'IDLE' && distToPlayer < CHASE_DISTANCE && !playerIsHiding) {
                    grannyState = 'CHASING';
                    grannyTarget = player; // Target the dynamic player object
                    grannyPath = [];
                }
                
                // 2. Check if player just hid while being chased
                if (grannyState === 'CHASING' && playerIsHiding) {
                    grannyState = 'IDLE'; // Switch to "investigate" state
                    grannyTarget = { x: player.x, y: player.y }; // Target the static hiding spot
                    grannyIdleTimer = 180; // Set timer for 3 seconds (180 frames)
                    grannyPath = []; // Recalculate path
                }

                // --- State-based Action ---
                
                // Handle IDLE waiting timer FIRST (runs every frame)
                if (grannyState === 'IDLE' && !grannyTarget) {
                    grannyIdleTimer--; // <-- This runs every frame
                    if (grannyIdleTimer <= 0) {
                        // Timer up! Go back to patrolling.
                        grannyState = 'PATROLLING';
                        grannyTarget = getRandomPatrolPoint();
                        grannyPath = [];
                    }
                }

                // Handle movement throttling
                grannyMoveCounter++;
                // Use difficulty-set speed
                if (grannyMoveCounter < currentGrannySpeed[grannyState]) {
                    return; // Not time to move yet
                }
                grannyMoveCounter = 0; // Reset move timer

                // --- It is time to move ---
                switch (grannyState) {
                    case 'PATROLLING':
                        // --- FIX: Was (granny.x === granny.x) ---
                        if (!grannyTarget || (granny.x === grannyTarget.x && granny.y === grannyTarget.y)) {
                            // Arrived at patrol point, get a new one
                            grannyTarget = getRandomPatrolPoint();
                            grannyPath = []; // Clear path
                        }
                        moveGrannyAlongPath();
                        break;

                    case 'CHASING':
                        // Player is the target, recalculate path frequently
                        grannyPath = []; // Force recalc
                        moveGrannyAlongPath();
                        break;

                    case 'IDLE':
                        if (grannyTarget) {
                            // We have a target (noise/last seen), move to it
                            if (granny.x === grannyTarget.x && granny.y === grannyTarget.y) {
                                // Arrived at location
                                grannyTarget = null; // Stop moving, let the timer run
                                grannyPath = [];
                            } else {
                                moveGrannyAlongPath();
                            }
                        }
                        // If no target, the timer is already ticking (at top of function)
                        break;
                }
            }
            
            // --- AI HELPER FUNCTIONS ---

            function moveGrannyAlongPath() {
                if (!grannyTarget) return;

                // Recalculate path if it's empty
                if (grannyPath.length === 0) {
                    grannyPath = findPath({x: granny.x, y: granny.y}, grannyTarget);
                }

                // Take the next step from the path
                const nextStep = grannyPath.shift();
                if (nextStep) {
                    // Only move if the next step is also walkable (e.g., player didn't lock a door)
                    if (isWalkable(nextStep.x, nextStep.y)) {
                        granny.x = nextStep.x;
                        granny.y = nextStep.y;
                    } else {
                        grannyPath = []; // Path blocked, force recalc
                    }
                }
            }
            
            // --- Simple BFS Pathfinding ---
            function findPath(start, end) {
                let queue = [{ x: start.x, y: start.y, path: [] }];
                let visited = new Set();
                visited.add(`${start.x},${start.y}`);
                const dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]]; // Up, Down, Left, Right

                while (queue.length > 0) {
                    let current = queue.shift();

                    if (current.x === end.x && current.y === end.y) {
                        return current.path; // Found the end
                    }

                    for (const [dx, dy] of dirs) {
                        const nextX = current.x + dx;
                        const nextY = current.y + dy;
                        const nextKey = `${nextX},${nextY}`;

                        // Check if walkable AND not visited
                        if (isWalkable(nextX, nextY) && !visited.has(nextKey)) {
                            visited.add(nextKey);
                            let newPath = [...current.path, { x: nextX, y: nextY }];
                            queue.push({ x: nextX, y: nextY, path: newPath });
                        }
                    }
                }
                return []; // No path found
            }

            function getRandomPatrolPoint() {
                if (grannyPatrolPointsCoords.length === 0) return { x: 1, y: 1 }; // Failsafe
                return grannyPatrolPointsCoords[Math.floor(Math.random() * grannyPatrolPointsCoords.length)];
            }
            
            // --- GAME STATE FUNCTIONS ---

            function checkCollisions() {
                // Check Granny catch
                if (player.x === granny.x && player.y === granny.y && !playerIsHiding) {
                    loseGame();
                }
            }
            
            function winGame() {
                gameState = 'won';
                messageTitle.textContent = 'YOU ESCAPED!';
                messageTitle.classList.remove('text-red-500');
                messageScreen.classList.remove('hidden');
            }

            function loseGame() {
                gameState = 'lost';
                messageTitle.textContent = 'CAUGHT!';
                messageTitle.classList.add('text-red-500');
                messageScreen.classList.remove('hidden');
            }
            
            function showGameMessage(msg, color) {
                gameMessageEl.textContent = msg;
                gameMessageEl.className = 'text-base mt-2 sm:mt-0'; // Reset classes
                switch(color) {
                    case 'yellow': gameMessageEl.classList.add('text-yellow-400'); break;
                    case 'blue': gameMessageEl.classList.add('text-blue-400'); break;
                    case 'red': gameMessageEl.classList.add('text-red-500'); break;
                    case 'cyan': gameMessageEl.classList.add('text-cyan-400'); break;
                    default: gameMessageEl.classList.add('text-gray-300');
                }
                
                // Clear message after a delay
                setTimeout(() => {
                    if (gameMessageEl.textContent === msg) {
                        gameMessageEl.textContent = '';
                    }
                }, 2500);
            }

            function updateUI() {
                // Inventory
                invKey1El.classList.toggle('hidden', !keys.key1);
                invKey2El.classList.toggle('hidden', !keys.key2);

                // Objectives
                if (keys.key1) { // <-- Swapped logic: key1 is door key
                    objKey1El.classList.add('line-through', 'text-green-500');
                    objKey1El.classList.remove('text-gray-400');
                }
                if (keys.key2) { // <-- Swapped logic: key2 is exit key
                    objKey2El.classList.add('line-through', 'text-green-500');
                    objKey2El.classList.Cremove('text-gray-400');
                }
                // Door objective is handled in checkInteractions
            }

            // --- EVENT LISTENERS (CONTROLS & MENUS) ---

            function handleKeyDown(e) {
                if (gameState !== 'playing') return;

                let moved = false;
                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                        movePlayer(0, -1);
                        moved = true;
                        break;
                    case 'ArrowDown':
                    case 's':
                        movePlayer(0, 1);
                        moved = true;
                        break;
                    case 'ArrowLeft':
                    case 'a':
                        movePlayer(-1, 0);
                        moved = true;
                        break;
                    case 'ArrowRight':
                    case 'd':
                        movePlayer(1, 0);
                        moved = true;
                        break;
                }

                if (moved) {
                    e.preventDefault(); // Stop window from scrolling
                }
            }

            // --- Main Menu Button Listeners ---
            playBtn.addEventListener('click', () => {
                mainMenu.classList.add('hidden');
                gameContainer.classList.remove('hidden');
                initGame();
            });

            restartBtn.addEventListener('click', () => {
                messageScreen.classList.add('hidden');
                gameContainer.classList.add('hidden');
                mainMenu.classList.remove('hidden');
                // Stop the old game loop
                gameState = 'menu';
                gameLoop._running = false;
            });

            // --- Difficulty Button Listeners ---
            const diffButtons = [easyBtn, hardBtn, extremeBtn];
            easyBtn.addEventListener('click', () => setDifficulty('EASY', easyBtn));
            hardBtn.addEventListener('click', () => setDifficulty('HARD', hardBtn));
            extremeBtn.addEventListener('click', () => setDifficulty('EXTREME', extremeBtn));

            function setDifficulty(difficulty, selectedBtn) {
                gameDifficulty = difficulty;
                // Update button styles
                diffButtons.forEach(btn => btn.classList.remove('selected'));
                selectedBtn.classList.add('selected');
            }

            // --- Attach keyboard listener ---
            document.addEventListener('keydown', handleKeyDown);

        }); // <-- This closes the 'DOMContentLoaded' event listener
    </script>
</body>
